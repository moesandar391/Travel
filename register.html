<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white rounded-3xl shadow-md flex items-center justify-center min-h-screen">
    <section class="bg-white w-1/3 border-2 rounded-3xl shadow-md p-6">
        <div class="flex justify-center items-center mb-2">
            <img src="images/add-user.png" alt="Add User" class="w-10 rounded-lg bg-indigo-100 p-2">
        </div>
        <div class="text-center">
            <h1 class="font-bold text-3xl">Create Account</h1>
            <p class="text-gray-400">Join us today! It only takes a minute.</p>
        </div>
        <div>
            <form action="" class="mt-4 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 space-x-2 ">
                    <div>
                        <label for="name" class="font-semibold">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" class="w-full border rounded-lg bg-slate-100 p-2"
                            required>
                    </div>
                    <div>
                        <label for="email" class="font-semibold">Email Address</label>
                        <input type="email" id="email" placeholder="name@company.com"
                            class="w-full border rounded-lg bg-slate-100 p-2" required>
                    </div>
                </div>
                <div class="w-full flex flex-col">
                    <label for="password" class="font-semibold">Password</label>
                    <input type="w-full password" id="password" placeholder="........" minlength="8" class="border rounded-lg bg-slate-100 p-2" reguired>
                </div>
                <div class="w-full flex flex-col">
                    <label for="confirm" class="font-semibold">Confirm Password</label>
                    <input type="password" id="confirm" placeholder="........" minlength="8" class="w-full border rounded-lg bg-slate-100 p-2" reguired>
                </div>
                <div>
                    <input type="checkbox" id="check" required>
                     <label for="check">I agree to the 
                     <a href="" class="text-indigo-400 underline font-semibold">Terms
                        of Service</a> and <a href="" class="text-indigo-400 underline font-semibold">Privacy Policy.</a></label>
                </div>
                <div>
                    <button class="w-full rounded-lg bg-indigo-800 text-white text-xl p-2"> Create My Account >>
                    </button>
                </div>
            </form>
        </div>
        <div class="flex justify-center items-center">
            <p>Already have an account?</p>
            <a href="login.html" class="font-bold text-indigo-800">Sign in here</a>
        </div>
    </section>
</body>

</html>
