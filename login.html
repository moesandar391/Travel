<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white rounded-3xl shadow-md flex items-center justify-center min-h-screen">
    <section class="bg-white w-1/3 border-2 rounded-3xl shadow-md p-6">
        <div class="flex justify-center items-center">
            <img src="images/padlock.png" alt="Add User" class="w-10 rounded-lg bg-indigo-100 p-2">
        </div>
        <div class="text-center mb-2">
            <h1 class="font-bold text-3xl mb-2">Welcome Back</h1>
            <p class="text-gray-400">Enter your credentials to access your account.</p>
        </div>
        <div>
            <form action="" class="flex flex-col gap-4">
                <div class="w-full flex flex-col">
                    <label for="email" class="font-semibold">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com"
                        class="w-full border rounded-lg bg-slate-100 p-2" required>
                </div>
                <div class="w-full flex flex-col">
                    <label for="password" class="font-semibold">Password</label>
                    <input type="password" id="password" placeholder="........" minlength="8"
                        class="w-full border rounded-lg bg-slate-100 p-2" reguired>
                </div>
                <div class="flex justify-between">
                    <div>
                        <input type="checkbox" id="check" required><label for="check"> Remember me </label>
                    </div>
                    <a href="" class="text-blue-500 font-semibold">Forgot Password?</a>
                </div>
                <div class="flex">
                    <button class="w-full rounded-lg bg-blue-700 text-white text-xl p-2"> Log in &#10132;

                    </button>
                </div>
            </form>
        </div>
        <div class="flex justify-center items-center">
            <p>Don't you have an account yet?</p>
            <a href="register.html" class="font-bold text-blue-500">Sign up for free</a>
        </div>
    </section>
</body>

</html>
